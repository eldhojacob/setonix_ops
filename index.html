        </a>

        <!-- Mobile hamburger (JS wiring is a later task) -->

          class="md:hidden inline-flex items-center justify-center h-10 w-10 rounded-lg text-brand-700 hover:bg-brand-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-400"
          aria-label="Toggle navigation menu"
          aria-controls="mobile-menu"
          aria-expanded="false"
        >
          <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
